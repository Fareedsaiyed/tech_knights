<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ganpat University | Welcome</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <main class="center-screen mosaic-screen">
    <section class="splash glass mosaic-splash">
      <div class="mosaic-logo-stage">
        <div class="logo-mosaic" id="logoMosaic" aria-hidden="true"></div>
        <div class="logo-final-wrap" id="logoFinalWrap">
          <img src="logo.jpeg" alt="Ganpat University Logo" class="logo-final-img" />
        </div>
      </div>

      <span class="badge">Ganpat University ERP</span>
      <h1>Welcome to Ganpat University</h1>
      <p class="small" style="max-width:640px;margin:0 auto 22px;">
        Select your login and continue to the university management portal.
      </p>
      <div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap">
        <button class="btn btn-primary" id="enterBtn">Enter The University</button>
      </div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/index.js"></script>
</body>
</html>
